name: Deploy Poker PWA to GitHub Pages

# Publishes the static PWA in poker-pwa/ to GitHub Pages.
# One-time setup: in the repo, go to Settings → Pages → "Build and deployment"
# and set Source = "GitHub Actions". After that this workflow deploys on every
# push that touches the app (or run it manually from the Actions tab).

on:
  push:
    branches:
      - claude/poker-probability-pwa-0prbb5
    paths:
      - 'poker-pwa/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes supersede in-progress ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the poker-pwa folder as the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: poker-pwa

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
